spring.application.name=apigateway
server.port=${SERVER_PORT:8083}
spring.http.clients.imperative.factory=simple
spring.http.clients.connect-timeout=${GATEWAY_HTTP_CLIENT_CONNECT_TIMEOUT:2s}
spring.http.clients.read-timeout=${GATEWAY_HTTP_CLIENT_READ_TIMEOUT:10s}

gateway.services.inventory-base-url=${GATEWAY_INVENTORY_URL:http://localhost:8080}
gateway.services.booking-base-url=${GATEWAY_BOOKING_URL:http://localhost:8081}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8091/realms/book-my-event}
spring.security.oauth2.resourceserver.jwt.audiences=${KEYCLOAK_AUDIENCE:book-my-event-api}

# Protect the public booking route when Gateway cannot reach Booking Service.
resilience4j.circuitbreaker.instances.bookingServiceGateway.register-health-indicator=true
resilience4j.circuitbreaker.instances.bookingServiceGateway.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.bookingServiceGateway.sliding-window-size=${BOOKING_GATEWAY_CIRCUIT_BREAKER_WINDOW_SIZE:10}
resilience4j.circuitbreaker.instances.bookingServiceGateway.minimum-number-of-calls=${BOOKING_GATEWAY_CIRCUIT_BREAKER_MINIMUM_CALLS:5}
resilience4j.circuitbreaker.instances.bookingServiceGateway.failure-rate-threshold=${BOOKING_GATEWAY_CIRCUIT_BREAKER_FAILURE_RATE:50}
resilience4j.circuitbreaker.instances.bookingServiceGateway.wait-duration-in-open-state=${BOOKING_GATEWAY_CIRCUIT_BREAKER_OPEN_DURATION:20s}
resilience4j.circuitbreaker.instances.bookingServiceGateway.permitted-number-of-calls-in-half-open-state=${BOOKING_GATEWAY_CIRCUIT_BREAKER_HALF_OPEN_CALLS:3}
resilience4j.circuitbreaker.instances.bookingServiceGateway.automatic-transition-from-open-to-half-open-enabled=true

# The Gateway HTTP client owns its deadlines; do not add a second asynchronous timeout layer.
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true

# Publish only the operational endpoints needed for health and circuit diagnosis.
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.endpoint.health.show-details=never
management.health.circuitbreakers.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Inventory API
springdoc.swagger-ui.urls[0].url=/docs/inventory/v3/api-docs/public
springdoc.swagger-ui.urls[1].name=Booking API
springdoc.swagger-ui.urls[1].url=/docs/booking/v3/api-docs/public
springdoc.swagger-ui.urls-primary-name=Inventory API
springdoc.swagger-ui.disable-swagger-default-url=true
