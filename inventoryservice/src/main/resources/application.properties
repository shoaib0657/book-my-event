spring.application.name=inventoryservice
server.port=${SERVER_PORT:8080}
logging.level.root=${LOG_LEVEL_ROOT:INFO}

# Inventory Service owns venue and event data in inventory_db.
spring.datasource.url=${INVENTORY_DB_URL:jdbc:mysql://localhost:3306/inventory_db}
spring.datasource.username=${INVENTORY_DB_USERNAME:inventory_user}
spring.datasource.password=${INVENTORY_DB_PASSWORD:inventory_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
