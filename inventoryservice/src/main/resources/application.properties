spring.application.name=inventoryservice
server.port=${SERVER_PORT:8080}
logging.level.root=${LOG_LEVEL_ROOT:INFO}

# MySQL database configuration. Defaults are only for local development.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ticketing}
spring.datasource.username=${DB_USERNAME:ticketuser}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
