spring.application.name=bookingservice
server.port=${SERVER_PORT:8081}
logging.level.root=${LOG_LEVEL_ROOT:INFO}

# Booking Service owns the customer data in booking_db.
spring.datasource.url=${BOOKING_DB_URL:jdbc:mysql://localhost:3306/booking_db}
spring.datasource.username=${BOOKING_DB_USERNAME:booking_user}
spring.datasource.password=${BOOKING_DB_PASSWORD:booking_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

inventory.service.url=${INVENTORY_SERVICE_URL:http://localhost:8080/api/v1/inventory}
spring.http.clients.connect-timeout=${HTTP_CLIENT_CONNECT_TIMEOUT:2s}
spring.http.clients.read-timeout=${HTTP_CLIENT_READ_TIMEOUT:3s}

# Stop sending new reservation calls temporarily when Inventory has repeated infrastructure failures.
resilience4j.circuitbreaker.instances.inventoryService.register-health-indicator=true
resilience4j.circuitbreaker.instances.inventoryService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.inventoryService.sliding-window-size=${INVENTORY_CIRCUIT_BREAKER_WINDOW_SIZE:10}
resilience4j.circuitbreaker.instances.inventoryService.minimum-number-of-calls=${INVENTORY_CIRCUIT_BREAKER_MINIMUM_CALLS:5}
resilience4j.circuitbreaker.instances.inventoryService.failure-rate-threshold=${INVENTORY_CIRCUIT_BREAKER_FAILURE_RATE:50}
resilience4j.circuitbreaker.instances.inventoryService.wait-duration-in-open-state=${INVENTORY_CIRCUIT_BREAKER_OPEN_DURATION:20s}
resilience4j.circuitbreaker.instances.inventoryService.permitted-number-of-calls-in-half-open-state=${INVENTORY_CIRCUIT_BREAKER_HALF_OPEN_CALLS:3}
resilience4j.circuitbreaker.instances.inventoryService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.inventoryService.record-exceptions=com.shoaib.bookmyevent.bookingservice.exception.InventoryServiceUnavailableException
resilience4j.circuitbreaker.instances.inventoryService.ignore-exceptions=com.shoaib.bookmyevent.bookingservice.exception.ResourceNotFoundException,com.shoaib.bookmyevent.bookingservice.exception.BookingConflictException

# RestClient already owns connect/read deadlines, so do not add a second asynchronous timeout layer.
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true

# Expose only the operational endpoints needed to inspect this service and its circuit.
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.endpoint.health.show-details=never
management.health.circuitbreakers.enabled=true

# Kafka producer for versioned booking-created events.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[spring.json.add.type.headers]=false

booking.kafka.topic=${KAFKA_BOOKING_TOPIC:booking-created-v1}
booking.kafka.publish-timeout=${KAFKA_PUBLISH_TIMEOUT:5s}
