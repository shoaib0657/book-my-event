spring.application.name=orderservice
server.port=${SERVER_PORT:8082}
logging.level.root=${LOG_LEVEL_ROOT:INFO}

# Order Service owns the order records in order_db.
spring.datasource.url=${ORDER_DB_URL:jdbc:mysql://localhost:3306/order_db}
spring.datasource.username=${ORDER_DB_USERNAME:order_user}
spring.datasource.password=${ORDER_DB_PASSWORD:order_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
