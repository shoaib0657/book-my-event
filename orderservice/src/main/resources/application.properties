spring.application.name=orderservice
server.port=${SERVER_PORT:8082}
logging.level.root=${LOG_LEVEL_ROOT:INFO}

# Order Service owns the order records in order_db.
spring.datasource.url=${ORDER_DB_URL:jdbc:mysql://localhost:3306/order_db}
spring.datasource.username=${ORDER_DB_USERNAME:order_user}
spring.datasource.password=${ORDER_DB_PASSWORD:order_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Consume the versioned booking-created contract without depending on Booking Service classes.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_ORDER_GROUP_ID:order-service-v1}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties[spring.json.use.type.headers]=false
spring.kafka.consumer.properties[spring.json.value.default.type]=com.shoaib.bookmyevent.orderservice.event.BookingCreatedEvent
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.shoaib.bookmyevent.orderservice.event
spring.kafka.listener.ack-mode=record

order.kafka.booking-topic=${KAFKA_BOOKING_TOPIC:booking-created-v1}
